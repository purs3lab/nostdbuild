[package]
name = "shim"
description = "The core2 stand-in of the host_only_shim fixture: re-exports std::io when its own default `std` feature is on"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
name = "shim"

# core2's own table: `default = ["std"]`. A dependent that does not say
# `default-features = false` gets the std build, and on a bare-metal target that
# build fails before the dependent is ever compiled.
[features]
default = ["std"]
std = []

[workspace]
