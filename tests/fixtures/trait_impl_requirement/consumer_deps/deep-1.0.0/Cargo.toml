# simba in miniature. The impl the consumer's call needs is generated by a
# macro, so it does not exist in the syn tree at all — only the two invocations
# do, and they are what carry the `#[cfg]`.
[package]
name = "deep"
version = "1.0.0"
edition = "2021"

[features]
default = ["std"]
std = []
libm = []
libm_force = []
